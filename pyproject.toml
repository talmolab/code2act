[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "c2a"
version = "0.1.0"
description = "Code2Act: Switching non-Linear Dynamical Systems for modeling within-syllable neuromechanical control dynamics."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Kaiwen Bian", email = "kaiwen@talmolab.org"},
    {name = "Charles Zhang", email = "charleszhang@fas.harvard.edu"},
    {name = "Talmo Pereira", email = "talmo@salk.edu"},
]
keywords = ["keypoint-moseq", "imitation learning", "reinforcement learning", "neuromechanics"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core dependencies. The heavy chain (jax, brax, mujoco-mjx, flax, orbax,
# hydra, wandb, vnl-playground, mujoco_playground, etc.) is brought in by
# `track-mjx` itself, which users install from `./track-mjx/` (see README).
# c2a-only additions beyond the track-mjx set:
dependencies = [
    "numpy",
    "matplotlib",
    "pyyaml",
    "omegaconf",
    "h5py",
    "imageio[ffmpeg]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black[jupyter]",
]
# Extra deps for the hidden-dynamics analysis scripts under
# c2a/figures/plot_hidden_*.py. NOT installed by default because both
# pull from GitHub and ssm has a pre-install build quirk; see the
# Analysis dependencies section in the README for the exact install
# sequence (a plain `uv pip install -e ".[analysis]"` will fail on ssm
# without --no-build-isolation, and DSA needs a one-line patch on
# Python 3.12).
analysis = [
    # DSA pulls torch with no upper pin. PyTorch 2.10+ depends on the
    # CUDA-13 NVIDIA wheels (nvidia-cudnn-cu13, nvidia-cublas (no
    # suffix), cuda-toolkit==13.0.2, …), which collide with the
    # CUDA-12 cuDNN that jax-cuda12-plugin loads and break JAX-CUDA
    # init with CUDNN_STATUS_NOT_INITIALIZED. Hold torch on the last
    # CUDA-12 release line.
    "torch<2.10",
    # Mitchell Ostrow's DSA / InputDSA (NeurIPS 2024) — used by
    # c2a.figures.plot_hidden_dsa. PyPI name "dsa" is a different
    # unrelated package; we must install from GitHub.
    "DSA @ git+https://github.com/mitchellostrow/DSA.git",
    # Build helpers for ssm (which doesn't declare them itself).
    "autograd",
    "cython",
    # Linderman lab's ssm / rSLDS — used by
    # c2a.figures.plot_hidden_rslds. Not on PyPI; GitHub-only.
    # Install with --no-build-isolation after cython+numpy are present.
    "ssm @ git+https://github.com/lindermanlab/ssm.git",
]

[project.urls]
Homepage = "https://kbian.org/Code2Act-website/"
Source = "https://github.com/talmolab/code2act"

[tool.setuptools.packages.find]
where = ["."]
include = ["c2a*"]
exclude = ["track-mjx*", "data*", "docs*", "bash_scripts*", "Code2Act-website*", "tests*", "model_checkpoints*", "trained_mimic_ckpts*"]

[tool.setuptools.package-data]
c2a = ["assets/*.xml"]

[tool.black]
line-length = 88
target-version = ["py311", "py312"]
