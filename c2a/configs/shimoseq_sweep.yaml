# =============================================================================
# shMoSeq Hyperparameter Sweep Configuration
# =============================================================================
# Grid search over shMoSeq's hierarchical-HMM hyperparameters, fit on top
# of an existing KPMS code sequence (`best_codes.npz`).  Selection follows
# Weinreb, Kannan, ..., Linderman (Neuron 2026): lagged-MI on the input
# derives a target duration window → trans_kappa filter → log-prob peak;
# n_states picked by max average pairwise adjusted-Rand-score across seeds.
#
# IMPORTANT: state_moseq sets jax_enable_x64 process-globally; run in a
# separate process from RL training (which uses float32 JAX).
#
# Prerequisites:
#   - A finished KPMS sweep with `best_codes.npz` at data.codes_path
#     (defaults to the canonical 400-ms-median-duration KPMS fit produced
#     by `python -m c2a.codegen.run_sweep --config c2a/configs/kpms_sweep.yaml`).
#
# Usage:
#   python -m c2a.codegen.run_sweep --config c2a/configs/shimoseq_sweep.yaml
# =============================================================================

# Dispatcher reads this to route to c2a.codegen.shimoseq.sweep_impl.run_sweep.
model: shimoseq

data:
  # Input low-level syllables. shMoSeq is method-agnostic (any integer
  # sequence works) but we use the KPMS output produced by the prior sweep.
  codes_path: ${oc.env:C2A_ROOT,.}/outputs/tokenizer/kpms_sweep/best_codes.npz
  # Manual behavior labels — used by render_topk_bands.py for the
  # ground-truth row only. Selection is unsupervised (paper-faithful).
  labels_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_labels.csv
  # Keypoint provenance for the renderer's animated 3D skeleton + filmstrip
  # rows.  Same paths as `kpms_sweep.yaml`.
  reference_data_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_reference_clips.h5
  balanced_split_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_balanced_splits.json
  stac_xml_path: ${oc.env:C2A_ROOT,.}/c2a/assets/rodent.xml
  # The KPMS sweep that generated codes_path uses labeled clips in
  # [0, 841) at csv_to_h5_subsample=2.  Mirror those here so the renderer
  # picks the same clips.
  labeled_clip_range: [0, 841]
  csv_to_h5_subsample: 2

# Hyperparameter grid. Match the shMoSeq paper's example sweep:
# n_states ∈ {2..10} with 10 seeds each, log-spaced trans_kappa.
sweep:
  n_states: [3, 5, 7, 10, 15]
  trans_kappa: [1.0e+1, 1.0e+2, 1.0e+3, 1.0e+4, 1.0e+5]
  seeds_per_setting: 5

# Per-fit hyperparameters (not swept; held fixed across cells).
hyperparams:
  emission_gd_lr: 1.0e-2
  num_iters: 100
  seg_length: 256

# Selection knobs per Weinreb 2026 recipe.
selection:
  # Lag grid for the lagged-mutual-information analysis. Default: log-spaced
  # 1..seg_length/2.  Override here only if you want a different probe set.
  lags: null
  # Window around the lagged-MI peak to count as "in target duration".
  duration_band_frac: [0.5, 1.5]    # ± 50% / + 50% around peak

output:
  base_dir: outputs/tokenizer/shimoseq_sweep
