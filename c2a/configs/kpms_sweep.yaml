# =============================================================================
# KPMS Hyperparameter Sweep Configuration
# =============================================================================
# Grid search over KPMS settings to find the best syllable model.
#
# IMPORTANT: This sweep MUST run in a separate process from RL training
# because keypoint_moseq requires jax_enable_x64=True (process-global).
#
# Usage:
#   cd moseq_jax
#   python -m sweep.run_sweep
# =============================================================================

data:
  reference_data_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_reference_clips.h5
  balanced_split_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_balanced_splits.json
  stac_xml_path: ${oc.env:C2A_ROOT,.}/c2a/assets/rodent.xml
  # Optional human-behavior labels for coverage metrics (NMI + Hungarian
  # purity). Leave labels_path=null to skip coverage reporting. The sweep
  # reports coverage but still selects best model on MSE.
  # Behavior labels from KevinBian107/TopoMimic-annotation. Two-track
  # schema (Track ∈ {behavior, direction}); CSV frames at 30 fps, H5 at 15
  # fps so we set csv_to_h5_subsample=2. Default range covers all 842
  # clips; the sweep intersects with the balanced split anyway.
  labels_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_labels.csv
  labeled_clip_range: [0, 841]
  csv_to_h5_subsample: 2

sweep:
  num_states: [10, 20, 30]
  kappa: [1.0e+2, 3.0e+2, 1.0e+3, 3.0e+3, 1.0e+4, 3.0e+4, 1.0e+5]
  latent_dim: [10]
  model_type: ["arhmm"]
  seeds_per_setting: 2
  ar_iters: 50
  full_iters: 300

output:
  base_dir: outputs/kpms_sweep

codegen:
  sweep_results: outputs/kpms_sweep/sweep_results.json
  balanced_split: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_balanced_splits.json
  output: outputs/kpms_sweep/best_codes.npz
