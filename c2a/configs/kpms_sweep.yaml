# =============================================================================
# KPMS Hyperparameter Sweep Configuration
# =============================================================================
# Grid search over KPMS settings; selection follows Weinreb 2024 (Nature
# Methods): pick (kappa × num_states) with median state duration nearest
# 400 ms, then rank seeds by Expected Marginal Likelihood (EML).
#
# IMPORTANT: This sweep MUST run in a separate process from RL training
# because keypoint_moseq requires jax_enable_x64=True (process-global).
#
# Usage:
#   python -m c2a.codegen.run_sweep --config c2a/configs/kpms_sweep.yaml
# =============================================================================

# Dispatcher reads this to route to c2a.codegen.kpms.sweep_impl.run_sweep.
model: kpms

data:
  reference_data_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_reference_clips.h5
  balanced_split_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_balanced_splits.json
  stac_xml_path: ${oc.env:C2A_ROOT,.}/c2a/assets/rodent.xml
  # Manual behavior labels for *post-hoc* coverage reporting (NMI +
  # Hungarian purity at 4-class behavior / 3-class direction / 12-class
  # combined granularities). Reported in sweep_results.json but NOT used
  # for model selection — selection is paper-faithful (duration → EML).
  # Source: KevinBian107/TopoMimic-annotation.
  # CSV at 30 fps, H5 at 15 fps so csv_to_h5_subsample=2.
  labels_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_labels.csv
  labeled_clip_range: [0, 841]
  csv_to_h5_subsample: 2

sweep:
  # Densified around the 400ms-median-duration target (= 6 frames at 15 Hz).
  # The previous wide grid wasted compute on κ ≥ 1e4 cells that all
  # saturated at ~75–250-frame durations (12–40× off target).
  num_states: [15, 20, 30]
  kappa: [50, 75, 1.0e+2, 1.5e+2, 2.0e+2, 3.0e+2, 5.0e+2, 1.0e+3]
  latent_dim: [10]
  model_type: ["arhmm"]
  # Paper standard for stable EML rank: 10 seeds per (K, κ) cell.  At
  # 2 seeds the EML mean has SE ≈ 0.71 σ — basically can't distinguish
  # adjacent cells.  10 seeds gives SE ≈ 0.32 σ.
  seeds_per_setting: 10
  # Iterations bumped for safety margin; KPMS log-lik is often still
  # drifting at 300 for K=30.  paper recipe runs 100/500.
  ar_iters: 100
  full_iters: 500

# Paper-faithful selection per Weinreb 2024 Methods. Pick (kappa ×
# num_states) cell whose median state duration is closest to the target,
# then rank seeds in that cell by EML.
selection:
  target_duration_ms: 400      # Weinreb 2024: "median state duration of 400 ms"
  mocap_hz: 15                  # H5 sample rate (250 frames per 16.67-sec clip)
  tolerance_frac: 0.3           # ±30% acceptance window around target

output:
  base_dir: outputs/kpms_sweep

codegen:
  sweep_results: outputs/kpms_sweep/sweep_results.json
  balanced_split: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_balanced_splits.json
  output: outputs/kpms_sweep/best_codes.npz

# Auto-render top-K syllable visualizations after the sweep finishes.
# trajectory_plots ON by default = the canonical KPMS-native MoSeq grid.
# syllable_grids OFF by default = the older filmstrip / animated-3D layout
# (still available; flip syllable_grids: true if you want both).
auto_render:
  rank: mse
  top_k: 5
  trajectory_plots: true
  trajectory_plots_kwargs:
    pre: 0.167               # seconds before syllable onset
    post: 0.5                # seconds after syllable onset
    min_frequency: 0.0       # 0.0 = render every syllable that has a bout
                             # passing min_duration; raise (e.g. 0.001)
                             # to drop a long tail of rare/transient ones
    min_duration: 3
    fps: 30
    projection_planes: ["xy", "xz"]   # rows of the grid, in this order
    n_snapshots: 5           # overlaid pose snapshots per cell (PNG)
    n_samples_per_syllable: 50  # bouts averaged per syllable (cap)
    keypoint_colormap: autumn
    save_png: true           # planes_grid.png with snapshots overlaid
    save_gifs: true          # planes_grid.gif animated lockstep across syllables
  # Legacy filmstrip renderer:
  syllable_grids: false
  n_examples: 5
  bout_strategy: longest
  format: both
