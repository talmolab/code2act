# =============================================================================
# MoSeq Decoder-Only RL Configuration (Pipeline A)
# =============================================================================
# Trains a decoder-only policy where behavioral codes come from Keypoint-MoSeq
# instead of the VQ-VAE encoder. Compares pre-computed tokenizer (KPMS) against
# the learned tokenizer (VQ-VAE) for motor control.
# =============================================================================

# =============================================================================
# VNL Environment Configuration (same as vqvae_minimal.yaml)
# =============================================================================
env_config:
  mujoco_impl: "jax"

  solver: "newton"
  iterations: 5
  ls_iterations: 5
  naconmax: 131072
  njmax: 128
  noslip_iterations: 0

  sim_dt: 0.002
  ctrl_dt: 0.01
  mocap_hz: 50

  clip_length: 250
  clip_set: "all"
  reference_length: 5
  reference_stride: 1
  start_frame_range: [0, 20]
  qvel_init: "zeros"
  keep_clips_idx: null
  balanced_split_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_balanced_splits.json

  domain_randomization:
    use_domain_randomization: true
    floor_friction: [0.5, 1.0]
    static_friction_scale: [0.8, 1.2]
    armature_scale: [0.8, 1.2]
    com_jitter: [0.0, 0.005]
    link_mass_scale: [0.9, 1.1]
    torso_mass_jitter: [0.0, 0.05]
    qpos0_jitter: [0.0, 0.01]

  reward_terms:
    root_pos:
      exp_scale: 0.035
      weight: 1.0
    root_quat:
      exp_scale: 20.0
      weight: 1.0
    joints:
      exp_scale: 1.41
      weight: 1.0
    joints_vel:
      exp_scale: 1.0
      weight: 0.5
    bodies_pos:
      exp_scale: 0.25
      weight: 0.0
    end_eff:
      exp_scale: 0.03
      weight: 1.0
    torso_z_range:
      healthy_z_range: [0.0325, 0.5]
      weight: 1.0
    control_cost:
      weight: 0.02
    control_diff_cost:
      weight: 0.02
    energy_cost:
      max_value: 50.0
      weight: 0.01

  termination_criteria:
    root_too_far:
      max_distance: 0.2
    root_too_rotated:
      max_degrees: 90.0
    pose_error:
      max_l2_error: 6.0
    nan_termination: {}

# =============================================================================
# Rendering Configuration
# =============================================================================
render_config:
  render_camera_name: close_profile
  render_fps: 50
  render_interval: 5
  render_per_code_videos: false
  eval_rollouts_for_transition: 16
  num_eval_rollout_videos: 3

# =============================================================================
# Code Source Configuration
# =============================================================================
# Selects the per-frame discrete code that the decoder policy receives.
# All sources produce arrays of shape [N_clips, clip_length] int32 in
# [0, num_codes); MoSeqImitation, the network, and PPO are agnostic to
# which source generated them. See c2a/code_sources.py for the loader.
#
# code_source ∈
#   "kpms_raw"             — raw KPMS codes from a sweep (current default;
#                             accepts the file even if it carries
#                             is_merged=True, but warns).
#   "kpms_merged"          — merged KPMS codes; REQUIRES the .npz to carry
#                             is_merged=True provenance (written by
#                             c2a.codegen.kpms.merge_states.reencode_codes_npz).
#                             Refuses to silently treat raw codes as merged.
#   "gt_directional_turn"  — 5-class ground-truth labels:
#                             0=Immobile, 1=Rear, 2=Walk,
#                             3=Turn_Left, 4=Turn_Right.
#                             Direction is collapsed for non-Turn behaviors.
#                             Raises on any UNLABELED frame in the balanced
#                             split (data quality is enforced).
# When code_source ∈ {kpms_raw, kpms_merged} and codes_path is null, random
# codes are generated for smoke testing (legacy fallback).
# When code_source = gt_*, codes_path is ignored — labels come from CSV.
#
# network_config.num_codes is OVERRIDDEN at load time to match the source's
# actual codebook size, so the YAML value below is informational only.
kpms_config:
  code_source: kpms_merged
  # Path to pre-computed KPMS codes (.npz file from generate_codes.py).
  # Only used when code_source ∈ {kpms_raw, kpms_merged}.
  codes_path: ${oc.env:C2A_ROOT,.}/outputs/tokenizer/kpms_sweep/auto_merged/M1/codes_merged.npz
  # Ground-truth labels CSV. Only used when code_source = gt_*.
  labels_csv_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_labels.csv
  # CSV is annotated at 30 fps; H5 is at 15 fps -> divide by 2.
  csv_to_h5_subsample: 2

# =============================================================================
# Network Architecture - MoSeq Decoder-Only
# =============================================================================
network_config:
  arch_name: moseq_decoder

  # Code embedding (KPMS best_codes.npz has 50 unique codes: 0-49)
  num_codes: 50
  code_embed_dim: 16
  code_stack_size: 5             # stack N consecutive codes [t, t+1, ..., t+N-1] (1 = current only)

  # Decoder MLP (same sizes as VQ-VAE decoder)
  decoder_layer_sizes: [512, 512, 256, 256]
  critic_layer_sizes: [512, 512, 256, 256]

  # Continuous encoder (reference trajectory -> continuous latent)
  use_continuous_encoder: true
  encoder_layer_sizes: [512, 512, 256]
  continuous_latent_dim: 16
  encoder_uses_proprio: true        # concat [task_obs, proprio] as encoder input (matches mimic encoder)
  kl_weight: 0.05               # base KL weight (used if kl_schedule is "none")
  z_e_dropout_rate: 0.01         # prob of zeroing z_e per timestep (0 = off)

  # RNN Decoder (GRU-based recurrent decoder for temporal coherence)
  use_rnn_decoder: true
  rnn_cell_type: gru
  rnn_hidden_sizes: [512, 512, 256, 256]

  # z_e placement: action head only (GRU sees code+proprio only)
  # NOTE: auto-overridden to false when use_distillation_head=true
  z_e_at_action_head: false

  # Per-code hidden state reinitialization at code transitions
  reinit_hidden_on_code: false
  learned_hidden_init: false          # learned per-code init (vs zeros)

  # --- Distillation Head (Prior Distillation Pipeline) ---
  # When enabled, a distill head MLP reads h_t and predicts the frozen
  # pre-trained encoder's latent distribution via KL loss.  z_e is
  # automatically excluded from the action path.
  use_distillation_head: true
  distillation_head_layer_sizes: [512, 512, 256, 256]
  distill_kl_weight: 1.0                    # weight for KL(encoder_sg || distill_head)
  # Pre-trained encoder checkpoint — same-pipeline MoSeq checkpoint with
  # trained continuous encoder [512, 256, 256], latent_dim=4.
  distillation_encoder_checkpoint: ${oc.env:C2A_ROOT,.}/trained_mimic_ckpts/260413_040706_764936/
  distill_logvar_min: null
  distill_logvar_max: null

  # Pre-trained VAE decoder as readout (replaces single-Dense action head)
  # h_t → VAE head MLP → (mu, logvar) → sample z → [z, proprio] → VAE decoder → action
  # When use_distillation_head is also on, the same (mu, logvar) serve as the
  # distill prediction for KL alignment.  Head MLP uses distillation_head_layer_sizes.
  use_pretrained_decoder: true
  decoder_layer_sizes_vae: [512, 256, 256, 256]  # Must match mimic_encoder.yaml

  # KL schedule: controls kl_weight over training steps
  # Higher KL = z_e pushed toward unit Gaussian = less informative = GRU must use codes
  # "ramp": linear from start_value to end_value over [start_frac, end_frac] of training
  # "cosine_anneal": cosine annealing cycling between start_value and end_value
  # "none": kl_weight = constant (from kl_weight above)
  kl_schedule: "cosine_anneal"
  kl_schedule_config:
    start_value: 0.01            # KL weight at start of schedule (low = z_e informative)
    end_value: 0.05               # KL weight at end of schedule (high = z_e crushed)
    start_frac: 0.0              # fraction of training where schedule begins
    end_frac: 0.5                # fraction of training where schedule ends (ramp only)
    num_cycles: 4                # number of cosine cycles (cosine_anneal only)

# =============================================================================
# Training Setup
# =============================================================================
train_setup:
  agent_name: rodent
  run_name: moseq_decoder_test

  checkpoint_to_restore: null
  restore_from_run_state: null

  freeze_decoder: true

  train_test_split_info: null
  train_subset_ratio: 0.7

  eval_every: 20_000_000
  episode_length: 200
  reset_every: 20_000_000

  train_config:
    num_envs: 2048
    num_timesteps: 5_000_000_000
    batch_size: 512
    num_minibatches: 16
    num_updates_per_batch: 4
    learning_rate: 1e-4
    clipping_epsilon: 0.2
    discounting: 0.95
    action_repeat: 1
    entropy_cost: 0.05      # Phase 3 bump (was 1e-2): strengthens H[π|S,Z] for within-code action variation
    reward_scaling: 1
    normalize_observations: true
    unroll_length: 40
    seed: 0
    get_activation: false
    deterministic_eval: true

# =============================================================================
# code2code reward mode (optional)
# =============================================================================
# When ``code2code.reward_mode != off``, the env runs the frozen
# tokenizer on the rollout motion at every step and shapes the reward
# by the distance between the encoded z and the codebook entry for the
# target code. Encoder + codebook stay FROZEN — PPO never updates
# them. This is fundamentally different from the (removed) e2e_mode,
# which let PPO drift the codebook into a private control basis.
#
# Requirements:
#   - kpms_config.code_source must be 'kinematics_vae' | 'vqvae' | 'ps_vqvae'.
#     KPMS / gt_directional_turn raise NotSupportedError.
#   - The tokenizer_ckpt and kpms_config.codes_path MUST come from the
#     same training run (codebook-size match is asserted at startup).
#
# See scratch/2026-05-26-code2code-mode/design-A-reward-shaping.md.
code2code:
  reward_mode: off              # off | additive | replace
  tokenizer_kind: null          # vae | vqvae | ps_vqvae
  tokenizer_ckpt: null          # path to the tokenizer step_NNNNN dir

  # Mix weights (literature: AMP convention is track=0.5, alpha=0.5;
  # this conservative default keeps tracking dominant)
  alpha: 0.5                    # weight on the code-match term
  track_weight: 1.0             # weight on the existing tracking reward
                                # in additive mode (ignored in replace)
  replace_alive_bonus: 0.0      # constant per-step bonus in replace
                                # mode (suggest 0.1 for a soft floor)

  # Reward shape — see literature.md §"Design implications"
  reward_form: exp_neg_distance # exp_neg_distance | neg_distance
  distance_form: cosine         # cosine (CALM default) | l2

  # Temperature for exp_neg_distance. "auto" calls
  # calibrate_temperature(tokenizer, ref_clips) at startup to set τ
  # such that the initial reward ≈ 0.3 (mid-saturation). Override
  # with a float for manual control.
  temperature: 0.6      # Phase 3 bump (was "auto", ≈0.25): softens c2c basin so distinguishability has room to act
  calibrate_target_reward: 0.3
  calibrate_n_clips: 50
  calibrate_n_windows_per_clip: 8

  # VAE-only: path to the tokenizer.pkl with K-Means centroids
  vae_tokenizer_pkl: null

  # VQVAE / PS-VQVAE: encoder/decoder architecture knobs (must match
  # the ckpt's training-time config). Same shape as the
  # (now-removed) e2e_config.vqvae_arch.
  vqvae_arch:
    n_joints: 67
    use_qvel: false
    window_len: 10
    horizon: 5
    conv_channels: [64, 128, 256]
    conv_kernel_size: 3
    conv_head_layers: [256]
    decoder_layer_sizes: [256, 256, 256]

  # PS-VQVAE-only: per-group codebook structure. Pulled from the
  # tokenizer's best_codes.npz (ps_group_dims +
  # ps_group_codebook_sizes) when null.
  ps_group_dims: null
  ps_group_codebook_sizes: null

  log_diagnostics: true         # emit c2c/* WandB metrics every step

  # ---------------------------------------------------------------------------
  # Curriculum-mode schedule (only consulted when reward_mode == 'curriculum')
  # ---------------------------------------------------------------------------
  # Total env reward per step:
  #   (1 - α(τ)) · r_track + α(τ) · (alpha · match) + β(τ) · log(VS)
  # where τ = current_env_step / num_timesteps ∈ [0, 1] and the diversity
  # bonus log(VS) is computed in the PPO loss (see c2a/code2code/diversity.py).
  #
  # Hard validation in c2a/code2code/schedules.py:
  #   - alpha_max > 0.75 is REJECTED — c2c reward is root-invariant; tracking
  #     at weight ≥ 0.25 must remain primary forever to keep the policy stable.
  #     See scratch/registry/2026-05-30-c2c-reward-is-root-invariant/.
  #   - bootstrap (= num_timesteps × max(tau_mid - tau_scale, 0)) < 1e9 env
  #     steps is REJECTED — tracking needs that long to converge from scratch.
  curriculum_config:
    alpha_min: 0.05          # c2c weight at τ = 0 (tracking nearly pure)
    alpha_max: 0.75          # c2c weight at τ = 1 (HARD CAP)
    tau_mid: 0.30            # α transition midpoint (τ at which α = (min+max)/2)
    tau_scale: 0.05          # α transition sharpness (~10% of training)

  # ---------------------------------------------------------------------------
  # Finetune-mode config (only consulted when reward_mode == 'finetune')
  # ---------------------------------------------------------------------------
  # Loads a pretrained pure-tracking checkpoint (specified via
  # train_setup.checkpoint_to_restore — defaults to the path below) and
  # adds c2c + diversity on top with constant (or briefly-warmed-up) α
  # and β. Bootstrap-length validation is skipped (no bootstrap needed —
  # policy is loaded). α ≤ 0.75 hard cap still applies.
  #
  # Requirements:
  #   - Checkpoint MUST be pure-tracking (trained pre-2026-05-26, or
  #     with code2code.reward_mode == 'off'). Loading a c2c-trained ckpt
  #     here logs a warning but proceeds.
  #   - Tokenizer MUST match the K that the original checkpoint was
  #     trained with — the policy's code-embedding table is sized to
  #     that K. The default ckpt (260513_062522_599062) was trained
  #     with num_codes=50 and the K=30 default vae tokenizer at
  #     outputs/tokenizer/trained_kinematics_vae_ckpts/vae/.
  finetune_config:
    alpha: 0.75              # c2c weight (constant after warmup)
    warmup_fraction: 0.05    # linear ramp 0→target over first 5%; 0 = pure constants
    default_checkpoint: ${oc.env:C2A_ROOT,.}/model_checkpoints/260513_062522_599062
    expected_num_codes: 50   # asserted at startup against network_config.num_codes
    # Internal: resolved-absolute checkpoint path written by
    # _build_c2c_env_kwargs after path normalization; consumed by
    # _post_init_params_fn for the actual policy-params load.  Declared
    # here so OmegaConf struct mode allows the runtime update.
    _resolved_checkpoint: null

  # ---------------------------------------------------------------------------
  # Distillation fade schedule (Phase 2 of the skill-diversity redesign).
  # ---------------------------------------------------------------------------
  # Promotes network_config.distill_kl_weight from a constant to a function
  # of training progress τ.  Distillation holds at `init` early (anchors the
  # policy to the demo manifold) and fades toward `final` as α(τ) rises and
  # the new diversity-reward terms take over.
  #
  # Mode-specific shapes:
  #   - curriculum: tanh fade centered at tau_mid, scale tau_scale.  Midpoint
  #     comes AFTER α's tanh midpoint (0.30) so distillation still anchors
  #     during the high-risk α transition.
  #   - finetune: hold at `init` for tau_hold (so loaded ckpt isn't pulled
  #     out from under on iter 0), then linear decay from init to final
  #     over [tau_hold, tau_fade_end], then hold at final.
  #
  # Aggressive defaults (zero floor; fast finetune fade):
  distillation_schedule:
    init: 1.0
    final: 0.0
    # curriculum tanh:
    tau_mid: 0.28
    tau_scale: 0.04
    # finetune linear:
    tau_hold: 0.02
    tau_fade_end: 0.15

  # ---------------------------------------------------------------------------
  # Distinguishability term (Phase 4 / Term 3 of the skill-diversity objective)
  # ---------------------------------------------------------------------------
  # Per-step KL between π(·|s, z) and the code-marginalized π̄(·|s),
  # estimated by re-running the policy with K distance-weighted alt codes.
  # Reward is added to per-step rewards BEFORE GAE so it flows through
  # advantages.  Cost: K extra apply_sequence calls per loss invocation.
  distinguish_config:
    enabled: true
    weight: 0.01              # λ_A target (KL bonus weight at saturation)
    num_alt_codes: 3          # K — extra forward passes per loss call
    sampling: distance_weighted   # alternative: "uniform" (not implemented yet)
    sampling_distance: cosine     # matches c2c reward distance metric
    # lambda_A ramp shape (re-uses make_distillation_schedule under the hood
    # by passing init=weight, final=0 and inverting):
    lambda_A_schedule:
      # finetune mode:
      tau_hold: 0.02         # λ_A=0 for τ < tau_hold (while loaded ckpt warms up)
      tau_fade_end: 0.10     # λ_A reaches `weight` at this τ

# =============================================================================
# Logging Configuration
# =============================================================================
logging_config:
  project_name: moseq_experiments
  group_name: decoder_rl
  exp_name: moseq_decoder
  clip_id: 0
  model_path: ${oc.env:C2A_ROOT,.}/model_checkpoints

