# =============================================================================
# Full Pipeline Sweep Configuration
# =============================================================================
# Defines the KPMS + decoder hyperparameter grid for end-to-end tuning.
#
# Usage:
#   cd moseq_jax
#   bash run_pipeline.sh                          # uses this config
#   bash run_pipeline.sh --config path/to/other.yaml  # custom config
#
# The pipeline runs 3 stages in separate processes:
#   1. KPMS sweep (jax_enable_x64=True)
#   2. Per-setting code generation (jax_enable_x64=True)
#   3. Decoder RL training for each (code_set × decoder_hp) combination
# =============================================================================

data:
  reference_data_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_reference_clips.h5
  balanced_split_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_balanced_splits.json
  stac_xml_path: ${oc.env:C2A_ROOT,.}/c2a/assets/rodent.xml
  # Optional human-behavior labels for coverage metrics (NMI + Hungarian
  # purity). Leave labels_path=null to skip. Coverage is reported per fit;
  # model selection still uses MSE (no regression on downstream codegen).
  labels_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_labels.csv
  labeled_clip_range: [642, 741]

# --- Stage 1: KPMS fitting ---
sweep:
  num_states: [10, 20, 30]
  kappa: [1.0e+2, 3.0e+2, 1.0e+3, 3.0e+3, 1.0e+4, 3.0e+4, 1.0e+5]
  latent_dim: [10]
  model_type: ["arhmm"]
  seeds_per_setting: 2
  ar_iters: 50
  full_iters: 300

# --- Stage 2: code generation (auto) ---
codegen:
  sweep_results: outputs/pipeline_sweep/kpms/sweep_results.json
  balanced_split: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_balanced_splits.json
  output_dir: outputs/pipeline_sweep/codes

# --- Stage 3: decoder RL training ---
decoder:
  continuous_latent_dims: [2, 4]
  kl_weights: [0.01, 0.1]

  # RNN decoder (GRU-based recurrent decoder for temporal coherence)
  use_rnn_decoder: true
  rnn_hidden_sizes: [256]
  rnn_cell_type: gru
  use_continuous_encoder: false

  # z_e annealing (gradually reduce encoder contribution)
  z_e_anneal: false
  z_e_anneal_start_frac: 0.3
  z_e_anneal_end_frac: 0.7

  # Training budget per run (shorter for sweep, increase for final runs)
  num_timesteps: 500_000_000
  eval_every: 50_000_000

output:
  base_dir: outputs/pipeline_sweep/kpms
