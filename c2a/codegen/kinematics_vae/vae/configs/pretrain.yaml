# c2a vanilla kinematics-VAE pretraining config (mirrors Scott v15 defaults).
#
# Run with:
#   python -m c2a.codegen.kinematics_vae.vae.train
# Override any key on the CLI: e.g.
#   python -m c2a.codegen.kinematics_vae.vae.train \
#       train.num_steps=2000 train.batch_size=2048

defaults:
  - _self_

seed: 0

data:
  # Routed through c2a.paths.get_repo_root by the launcher; supports the
  # ${oc.env:C2A_ROOT} pattern used elsewhere in c2a/configs.
  reference_data_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_reference_clips.h5
  balanced_split_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_balanced_splits.json

arch:
  n_joints: 67
  use_qvel: false
  auto_detect_threshold: 1.0e-3
  branch_latent_dims: [4, 8, 12]   # root, axial, limb — sums to latent_dim=24
  window_len: 10
  horizon: 5
  conv_channels: [64, 128, 256]
  conv_kernel_size: 3
  conv_head_layers: [256]
  decoder_layer_sizes: [256, 256, 256]
  predictor_layer_sizes: [384, 256]

train:
  batch_size: 8192
  num_steps: 30000
  learning_rate: 3.0e-4
  lr_warmup_frac: 0.04
  lr_hold_frac: 0.20
  lr_end_value: 3.0e-5
  weight_decay: 1.0e-3
  grad_clip: 1.0
  log_every: 250
  eval_every: 500
  ckpt_every: 5000
  ckpt_dir: ${oc.env:C2A_ROOT,.}/outputs/tokenizer/trained_kinematics_vae_ckpts/vae

loss_weights:
  recon: 1.0
  pred: 0.3
  kl: 0.005          # target β_kl after linear anneal
  sigma_pen: 1.0     # w_sigma

schedules:
  beta_kl_anneal_steps: 5000
  sigma_max_start: 0.3
  sigma_max_end: 0.10
  sigma_max_anneal_frac: 0.5
