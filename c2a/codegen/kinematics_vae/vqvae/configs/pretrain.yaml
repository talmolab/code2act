# c2a vanilla VQVAE pretraining config — same backbone as the VAE
# variant, swapping the bottleneck for a single-codebook VQ.

defaults:
  - _self_

seed: 0

data:
  reference_data_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_reference_clips.h5
  balanced_split_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_balanced_splits.json

arch:
  n_joints: 67
  use_qvel: false
  auto_detect_threshold: 1.0e-3
  branch_latent_dims: [4, 8, 12]
  window_len: 10
  horizon: 5
  conv_channels: [64, 128, 256]
  conv_kernel_size: 3
  conv_head_layers: [256]
  decoder_layer_sizes: [256, 256, 256]
  predictor_layer_sizes: [384, 256]

codebook:
  size: 30                  # K — number of discrete codes
                            # code_dim is auto-derived from sum(branch_latent_dims)

train:
  batch_size: 8192
  num_steps: 30000
  learning_rate: 3.0e-4
  lr_warmup_frac: 0.04
  lr_hold_frac: 0.20
  lr_end_value: 3.0e-5
  weight_decay: 1.0e-3
  grad_clip: 1.0
  log_every: 250
  eval_every: 500
  ckpt_every: 5000
  ckpt_dir: ${oc.env:C2A_ROOT,.}/trained_kinematics_vae_ckpts/vqvae

# van den Oord 2017 weights: recon=1, β_commit=0.25, codebook implicit
# at coefficient 1 (codebook loss term in the gradient codebook variant
# is the only signal that moves the codebook, so it's not weighted down).
loss_weights:
  recon: 1.0
  pred: 0.3
  commit: 0.25
  codebook: 1.0
