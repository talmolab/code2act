# =============================================================================
# Multi-scale designed codebook v2 (K=20 + UNL sentinel = 21 slots)
# =============================================================================
# Derived from v1 by removing the `long` tier-type entirely. The 4-behavior
# space (Walk / Rear / Turn / Immobile) is now segmented purely through
# fine / palindromic-3 / directional-3 / 4-gram / 5-gram n-gram patterns;
# duration-anchored single-behavior bouts that v1 captured via long.* are
# now covered by repeated fine.* codes (or fall through to UNL).
#
# Schema per entry (unchanged from v1):
#   id            int     0..20 (UNL = 20)
#   name          str     human-readable, used in render overlays
#   type          str     fine | p3 | d3 | n4 | n5 | sentinel
#   tier          str     T1 | T2 | T3 | UNL
#   color         [r,g,b] base color for the multi-scale renderer (0..1)
#   labels        [str]   only for ngram types; sequence of labels to match
#   label         str     only for fine types; single label
#
# Matching rule (unchanged): longest-match-wins. Each frame gets the code
# of the LONGEST pattern that covers it; otherwise UNL. Implemented in
# c2a.codegen.designed_segmenter.build_codes().

priority_rule: type_then_length
# type_then_length: each codebook entry's `type` defines a priority tier
#   (n5 > n4 > p3 == d3 > fine > sentinel). Within a tier, the longest span
#   wins. Frames not covered by any match get the sentinel code.

# Color palette by tier-type (used by the render overlay):
#   fine  -> pale gray   [0.70, 0.70, 0.70]
#   p3    -> green       [0.20, 0.65, 0.30]
#   d3    -> cyan        [0.20, 0.60, 0.80]
#   n4    -> blue        [0.20, 0.30, 0.80]
#   n5    -> purple      [0.55, 0.30, 0.80]
#   UNL   -> dark gray   [0.30, 0.30, 0.30]

codebook:
  # ---------------------------------------------------------------------
  # FINE (single labels)
  # ---------------------------------------------------------------------
  - {id:  0, name: "fine.Walk",     type: fine, tier: T1, color: [0.70, 0.70, 0.70], label: Walk}
  - {id:  1, name: "fine.Rear",     type: fine, tier: T1, color: [0.70, 0.70, 0.70], label: Rear}
  - {id:  2, name: "fine.Turn",     type: fine, tier: T1, color: [0.70, 0.70, 0.70], label: Turn}
  - {id:  3, name: "fine.Imm",      type: fine, tier: T1, color: [0.70, 0.70, 0.70], label: Immobile}

  # ---------------------------------------------------------------------
  # PALINDROMIC TRIGRAMS (A -> B -> A, natural "chunk" units)
  # ---------------------------------------------------------------------
  - {id:  4, name: "p3.Imm_Turn_Imm",    type: p3, tier: T1, color: [0.20, 0.65, 0.30], labels: [Immobile, Turn, Immobile]}
  - {id:  5, name: "p3.Turn_Imm_Turn",   type: p3, tier: T1, color: [0.20, 0.65, 0.30], labels: [Turn, Immobile, Turn]}
  - {id:  6, name: "p3.Imm_Rear_Imm",    type: p3, tier: T2, color: [0.20, 0.65, 0.30], labels: [Immobile, Rear, Immobile]}
  - {id:  7, name: "p3.Turn_Walk_Turn",  type: p3, tier: T2, color: [0.20, 0.65, 0.30], labels: [Turn, Walk, Turn]}

  # ---------------------------------------------------------------------
  # DIRECTIONAL TRIGRAMS (A -> B -> C, sequential planning)
  # ---------------------------------------------------------------------
  - {id:  8, name: "d3.Rear_Turn_Imm",   type: d3, tier: T2, color: [0.20, 0.60, 0.80], labels: [Rear, Turn, Immobile]}
  - {id:  9, name: "d3.Walk_Turn_Imm",   type: d3, tier: T2, color: [0.20, 0.60, 0.80], labels: [Walk, Turn, Immobile]}
  - {id: 10, name: "d3.Rear_Imm_Turn",   type: d3, tier: T2, color: [0.20, 0.60, 0.80], labels: [Rear, Immobile, Turn]}
  - {id: 11, name: "d3.Imm_Turn_Walk",   type: d3, tier: T2, color: [0.20, 0.60, 0.80], labels: [Immobile, Turn, Walk]}
  - {id: 12, name: "d3.Turn_Imm_Rear",   type: d3, tier: T2, color: [0.20, 0.60, 0.80], labels: [Turn, Immobile, Rear]}

  # ---------------------------------------------------------------------
  # 4-GRAMS (extended alternation patterns)
  # ---------------------------------------------------------------------
  - {id: 13, name: "n4.Turn_Imm_Turn_Imm", type: n4, tier: T1, color: [0.20, 0.30, 0.80], labels: [Turn, Immobile, Turn, Immobile]}
  - {id: 14, name: "n4.Imm_Turn_Imm_Turn", type: n4, tier: T1, color: [0.20, 0.30, 0.80], labels: [Immobile, Turn, Immobile, Turn]}
  - {id: 15, name: "n4.Imm_Turn_Walk_Turn",type: n4, tier: T2, color: [0.20, 0.30, 0.80], labels: [Immobile, Turn, Walk, Turn]}
  - {id: 16, name: "n4.Rear_Imm_Turn_Imm", type: n4, tier: T2, color: [0.20, 0.30, 0.80], labels: [Rear, Immobile, Turn, Immobile]}

  # ---------------------------------------------------------------------
  # 5-GRAMS (long routines -- chunks across 5 segments)
  # ---------------------------------------------------------------------
  - {id: 17, name: "n5.Imm_Turn_Imm_Turn_Imm",  type: n5, tier: T1, color: [0.55, 0.30, 0.80], labels: [Immobile, Turn, Immobile, Turn, Immobile]}
  - {id: 18, name: "n5.Imm_Turn_Walk_Turn_Imm", type: n5, tier: T2, color: [0.55, 0.30, 0.80], labels: [Immobile, Turn, Walk, Turn, Immobile]}

  # ---------------------------------------------------------------------
  # TIER 3 (borderline >=10 instances)
  # ---------------------------------------------------------------------
  - {id: 19, name: "p3.Imm_Walk_Imm",   type: p3,   tier: T3, color: [0.20, 0.65, 0.30], labels: [Immobile, Walk, Immobile]}

  # ---------------------------------------------------------------------
  # SENTINEL: assigned to frames not covered by any pattern
  # ---------------------------------------------------------------------
  - {id: 20, name: "UNL",  type: sentinel, tier: UNL, color: [0.30, 0.30, 0.30]}
