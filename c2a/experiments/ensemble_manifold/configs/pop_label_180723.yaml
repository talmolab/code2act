# @package _global_
# =============================================================================
# Override: ckpt 260603_180723_008126 (vqvae k=8 commit=0.5)
# =============================================================================
# Tokenizer: vqvae k=8 → 4 codes actually used in the corpus ({0, 1, 3, 4})
#
# Per-(label×code) analysis on the saved train+test codes:
#   Walk     91% on code 3                (run-length ~23 frames)
#   Rear     50% on code 3, 41% on code 1 (3↔1 oscillation, runs 46+72)
#   Turn     60% on code 3, 40% on code 4 (3↔4 oscillation, runs 18+17)
#   Immobile 57% on code 4, 42% on code 3 (4↔3 oscillation, runs 65+44)
#
# Note: this tokenizer collapses Walk/Turn/Imm into the same {3,4} pair —
# distinguishable only by oscillation block-length.  Walk vs Turn vs Imm
# cells will look qualitatively similar in this ckpt.
# =============================================================================

defaults:
  - population_label_patterns
  - _self_

checkpoint:
  path: ${oc.env:C2A_ROOT,.}/model_checkpoints/260603_180723_008126
  step: null

label_to_mode_code:
  Immobile: 4
  Rear:     1
  Walk:     3
  Turn:     3

pattern_per_label:
  Walk:     { mode: "hold",      codes: [3] }
  Rear:     { mode: "oscillate", codes: [3, 1],     block_frames: 50 }
  Turn:     { mode: "oscillate", codes: [3, 4],     block_frames: 17 }
  Immobile: { mode: "oscillate", codes: [4, 3],     block_frames: 50 }

output:
  base_dir: ${paths.c2a_root}/outputs/ensemble_manifold/pop_label_180723_same_pos
