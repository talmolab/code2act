# =============================================================================
# Labeled-behavior RNN Hidden Dynamics Experiment
# =============================================================================
# Counterpart to hidden_dynamics_exp.yaml.  Picks ONE KPMS code per
# directional-turn label by **label agreement** (mode of the KPMS code
# histogram across the manually-labeled frames of that label), then
# sustains that code for `target_steps` control steps across K starting
# body positions.  Termination is disabled so the full window is
# captured cleanly.
#
# Labels source: KevinBian107/TopoMimic-annotation
# Schema (5 classes, matching c2a.codegen.code_sources.gt_directional_turn):
#   Immobile     (any direction)
#   Rear         (any direction)
#   Walk         (any direction)
#   Turn_Left    (Turn × Left)
#   Turn_Right   (Turn × Right)
# Turn_Straight is absent in the current CSV and stays UNLABELED.
#
# Usage:
#   python -m c2a.experiments.run_labeled_hidden_dynamics
# =============================================================================

checkpoint:
  # Latest decoder, trained against KPMS-merged M1 codes
  # (outputs/kpms_sweep/auto_merged/M1/codes_merged.npz). Keep this
  # in sync with whichever moseq_decoder.yaml configuration produced
  # the active model.
  path: ${oc.env:C2A_ROOT,.}/model_checkpoints/260508_190937_955263/
  step: null

data:
  # Codes are now loaded via ``c2a.codegen.code_sources.load_codes`` keyed off
  # ``ckpt_cfg.kpms_config`` (saved inside the checkpoint), so the
  # experiment automatically uses whichever code_source / codes_path /
  # labels_csv_path the policy was trained against. The field below is
  # **informational only** — kept for documentation / forward-compat.
  codes_path: ${oc.env:C2A_ROOT,.}/outputs/kpms_sweep/auto_merged/M1/codes_merged.npz
  balanced_split_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_balanced_splits.json
  reference_data_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_reference_clips.h5
  labels_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_labels.csv
  labeled_clip_range: [0, 841]
  csv_to_h5_subsample: 2  # CSV at 30 fps → H5 at 15 fps (250 frames/clip)

# Sustained-code rollout length, in CONTROL STEPS (env at 100 Hz).
# 1000 ctrl steps = 10 sec sim time = 10 sec video at 50 fps render.
target_steps: 1000

# Number of starting body positions sampled from the test split (with
# fixed seed). The SAME K positions are used for every label so the
# only varying factor across labels is the held KPMS code.
K_per_label: 8

# Drop directional-turn labels whose total labeled-frame count is
# below this. All 5 classes are typically well above this threshold
# in the current CSV; this is a safety net against future label drift.
min_label_frames: 100

# How to select the agreement code per label:
#   mode             — argmax P(c|L). Vulnerable to KPMS junk clusters
#                      (a dominant baseline code wins for every label).
#   mode_excluding   — argmax P(c|L) over codes NOT in `exclude_codes`.
#                      DEFAULT. Skips known junk codes. With the
#                      directional-turn 5-class scheme, this usually
#                      gets specific codes for Turn_Left and Turn_Right
#                      (they have distinct movement); Immobile / Rear /
#                      Walk may collide on a shared common code unless
#                      the KPMS fit cleanly separates them.
#   enrichment       — argmax P(c|L) / P(c) subject to P(c|L) >= floor.
#                      Picks the code most over-represented in this label
#                      vs the corpus base rate. Best per-label specificity
#                      but requires `min_within_label_frac` to avoid
#                      over-fitting on rare codes.
selection_rule: mode_excluding
exclude_codes: [0]
min_within_label_frac: 0.05

# Verification-video ghost bodies per label.
num_video_bodies: 5

# Disable env termination criteria (root_too_far, root_too_rotated,
# pose_error) so 1000-step sustained-code rollouts don't auto-reset
# mid-trajectory. nan_termination is still active as a safety net.
disable_far_termination: true

seed: 42
render_video: true

output:
  base_dir: ./outputs/labeled_hidden_dynamics
