# =============================================================================
# Code Distinctness Experiment (label-free) — P1 + P2 + P3
# =============================================================================
# Post-processes a run_code_grid_rollouts output directory + the tokenizer
# codes npz to produce three label-free figures arguing the code basis is a
# finer, reproducible partition of motion space than the MMD merge or the
# 4-class behavior ethogram:
#
#   P1  within-code vs between-code MMD vs a code-shuffled null
#   P2  behavioral-phylogeny dendrogram + reordered MMD heatmap w/ noise floor
#   P3  NMI(code ; ethogram) + effective code count + behavior->code spread
#
#   python -m c2a.experiments.run_code_distinctness
# =============================================================================

# run_code_grid_rollouts output directory to read (rollout npzs + distance).
output:
  base_dir: ./outputs/code_grid_rollouts
  run_name: default

# Tokenizer codes npz (train_codes / test_codes / *_indices / num_states).
# Used only by P3 for NMI against the ethogram. MUST match the tokenizer
# that produced the rollouts being analyzed.
codes_path: ${oc.env:C2A_ROOT,.}/outputs/tokenizer/trained_kinematics_vae_ckpts/vae/best_codes.npz

data:
  labels_path: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_labels.csv
  labeled_clip_range: [0, 841]
  csv_to_h5_subsample: 2

# Poses to analyze (each has its own rollouts + distance matrix).
poses: [walk, rear]

# Drop the global root translation (first 3 qpos dims) before MMD, so
# trajectories are compared on body posture not world location. Matches
# run_code_grid_rollouts' merge.strip_root_pos.
strip_root_pos: true

# Number of code-shuffled null draws for P1 / P3.
n_null_samples: 200

seed: 0
