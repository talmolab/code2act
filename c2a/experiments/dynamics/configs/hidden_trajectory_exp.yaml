# =============================================================================
# Natural Hidden State Trajectory Experiment
# =============================================================================
# Samples long continuous segments, runs KPMS, feeds natural code sequences
# through C2A to collect hidden state trajectories colored by code identity.
# =============================================================================

new_data:
  path: ${oc.env:C2A_GENERALIZATION_H5,./data/external/transform_art_2020_12_22_1.h5}

kpms:
  model_dir: ${oc.env:C2A_ROOT,.}/outputs/tokenizer/kpms_sweep/s50_k1e+04_l10_arhmm/seed1
  model_name: keypoint_arhmm_states50_seed1
  num_iters: 200

stac_xml: ${oc.env:C2A_ROOT,.}/c2a/assets/rodent.xml
reference_h5: ${oc.env:C2A_ROOT,.}/data/rodent/rodent_reference_clips.h5

checkpoint:
  path: ${oc.env:C2A_ROOT,.}/model_checkpoints/260407_031233_484020/
  step: null

K: 10
frames_per_segment: 2000
seed: 42

output:
  base_dir: ./outputs/moseq_hidden_trajectory
